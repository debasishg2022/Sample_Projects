name: CD Pipeline for Snowflake Deployment

on: 
    push:
        branches: [main]
        
jobs:
    deploy:
        runs-on : ubuntu-latest
        steps:
            - name: Get latest actions for checkout
              uses: actions/checkout@v4
              with:
                    fetch-depth: 0
            - name: Get latest actions for snowflake operations
              uses: snowflakedb/snowflake-actions@v3
            - name: Create connection statement
              run: |
                    mkdir -p ~/.snowflake
                    cat <<EOF> ~/.snowflake/config.toml
                    [connections.cicd]
                    account = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
                    user = "${{ secrets.USER }}"
                    password = "${{ secrets.PASSWORD }}"
                    host = "${{ secrets.HOST }}"
                    region = "${{ secrets.REGION }}"
                    port = "${{ secrets.PORT }}"
                    protocol = "${{ secrets.PROTOCOL }}"
                    database = "${{ secrets.DATABASE }}"
                    schema = "${{ secrets.SCHEMA }}"
                    warehouse = "${{ secrets.SNOWFLAKE_WAREHOUSE }}"
                    role = "${{ secrets.ROLE }}"
                    authenticator = "${{ secrets.AUTHENTICATOR }}"
                    
                    EOF
                    
                    chmod 600 ~/.snowflake/config.toml
            - name: test snow connection
              run: snow connection test -c cicd
            - name: Find latest files for Deployment and do the deployment
              run: |
                   changed_files=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '\.sql$' )
                   for i in $changed_files
                   do
                     snow sql -c cicd -f "$i"
                   done
            
            
            
        